[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "job-radar-community"
version = "0.1.0b1"
description = "Local, explainable job discovery radar."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "pydantic>=2.8,<3.0",
  "PyYAML>=6.0,<7.0",
  "typer>=0.12,<1.0",
  "uvicorn>=0.30,<1.0",
]

[project.scripts]
job-radar = "job_radar.cli:app"

[dependency-groups]
dev = [
  "pip-audit>=2.10,<3.0",
  "pytest>=9.0.1,<10.0",
  "ruff>=0.16.4,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/job_radar"]

[tool.hatch.build]
exclude = ["/.superpowers"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
