name: Bug report
description: Report a reproducible problem in the public local edition.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Use fictitious data only. Do not include CVs, cookies, API tokens, passwords, SQLite files, or personal data.
  - type: input
    id: version
    attributes:
      label: Version
      description: Release, commit, Python version, and Node version when relevant.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal steps, expected result, and observed result using synthetic data.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I confirm this report contains no CV, cookies, tokens, credentials, or personal application data.
          required: true
